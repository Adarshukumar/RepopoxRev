/*
 * ABYSSAL for Android — settings
 *
 * There is deliberately no gradle/wrapper directory. The wrapper JAR is a binary
 * that could not be fetched from the environment this project was authored in, so
 * CI installs Gradle itself via gradle/actions/setup-gradle and invokes `gradle`
 * directly. See .github/workflows/build-apk.yml.
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ABYSSAL"
include ':app'
