# ═══════════════════════════════════════════════════════════════════════════
# ABYSSAL — build the Android APK
#
# This workflow exists because the environment the app was written in cannot build
# one. It has no JDK, no Android SDK and no Gradle, and dl.google.com,
# repo.maven.apache.org, services.gradle.org, plugins.gradle.org and maven.google.com
# are all unreachable from it. GitHub's runners have the JDK and the Android SDK
# preinstalled and can reach all of them, so compilation happens here instead.
#
# It also solves a second problem. Release assets upload via uploads.github.com,
# which that same environment cannot reach -- so the v1.0.0-abyssal release was
# published with the web app's zip committed into the tree instead of attached. A
# runner can reach uploads.github.com, which means the APK below genuinely lands on
# the release as a downloadable asset.
#
# There is no gradle/wrapper in the project: the wrapper JAR is a binary that could
# not be fetched while authoring. gradle/actions/setup-gradle installs Gradle itself
# and the steps call `gradle` directly.
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  push:
    branches:
      - arena/c4a5f7e4-repopoxrev
      - main
    paths:
      - 'abyssal/**'
      - 'abyssal-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  # needed to attach the APK to the release; the default token is read-only for
  # contents on many repositories
  contents: write

concurrency:
  group: abyssal-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: abyssal-android-1.0.0-debug.apk
  RELEASE_TAG: v1.0.0-abyssal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      # The web app is not duplicated into the Android tree in git. It is copied in
      # here, at build time, so there is exactly one copy of the descent and its
      # physics and the two cannot drift apart.
      - name: Copy the web app into assets
        run: |
          set -euo pipefail
          DEST=abyssal-android/app/src/main/assets/abyssal
          mkdir -p "$DEST"
          cp -r abyssal/index.html abyssal/css abyssal/js "$DEST"/

          echo "--- what will ship inside the APK ---"
          find "$DEST" -type f | sort

          # dist/ holds the release zip and tools/ holds the jsdom smoke test.
          # Neither belongs in an installed app, and both would bloat it.
          test ! -e "$DEST/dist"  || { echo "::error::dist/ leaked into assets"; exit 1; }
          test ! -e "$DEST/tools" || { echo "::error::tools/ leaked into assets"; exit 1; }

          # index.html and every script it loads must be present, or the WebView
          # shows a blank page and nothing in the build fails loudly.
          for f in index.html css/abyssal.css \
                   js/data.js js/spring.js js/theme.js js/canvas.js \
                   js/audio.js js/sheet.js js/app.js; do
            test -f "$DEST/$f" || { echo "::error::missing asset $f"; exit 1; }
          done
          echo "asset manifest complete: 9 files"

      - name: Build debug APK
        working-directory: abyssal-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          set -euo pipefail
          SRC=abyssal-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC" || { echo "::error::APK not produced"; exit 1; }
          cp "$SRC" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          ls -l "$APK_NAME"

          # An APK is a zip. Check it is one, and that the web app really is inside
          # it -- a build that silently dropped the assets would still succeed.
          python3 - <<'PY'
          import sys, zipfile, os
          name = os.environ["APK_NAME"]
          z = zipfile.ZipFile(name)
          bad = z.testzip()
          if bad is not None:
              print("::error::APK is corrupt at " + bad); sys.exit(1)
          entries = z.namelist()
          required = ["AndroidManifest.xml", "classes.dex",
                      "assets/abyssal/index.html", "assets/abyssal/js/app.js",
                      "assets/abyssal/css/abyssal.css"]
          missing = [r for r in required if r not in entries]
          if missing:
              print("::error::APK missing " + ", ".join(missing)); sys.exit(1)
          assets = [e for e in entries if e.startswith("assets/abyssal/")]
          print("APK is a valid zip")
          print("  entries          :", len(entries))
          print("  web-app assets   :", len(assets))
          print("  size             : %.1f KB" % (os.path.getsize(name) / 1024))
          print("  required present :", ", ".join(required))
          PY

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      # The point of the whole exercise: a real download on the release page.
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          echo "--- assets now on $RELEASE_TAG ---"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes\n    \(.browser_download_url)"'
