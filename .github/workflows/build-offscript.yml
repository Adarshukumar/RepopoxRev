name: Offscript Android
on:
  push:
    branches: [arena/c4a5f7e4-repopoxrev]
    paths: ['offscript-android/**', '.github/workflows/build-offscript.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Offscript 1.0.0 preview APK after all checks
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: offscript-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: offscript-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure
        run: |
          set -o pipefail
          gradle projects --console=plain 2>&1 | tee build.log
      - name: Compile native app and test APK
        run: |
          set -o pipefail
          gradle assembleDebug assembleDebugAndroidTest --console=plain 2>&1 | tee -a build.log
      - name: Domain unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --console=plain 2>&1 | tee -a build.log
      - name: Verify APK structure and signature block
        run: python3 ci/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native emulator interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: offscript-android
          script: |
            set -o pipefail
            gradle connectedDebugAndroidTest --console=plain 2>&1 | tee -a build.log
            mkdir -p screenshots
            adb pull /sdcard/Android/data/dev.offscript.social/files/. screenshots/
      - name: Report errors and test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          {
            echo '### Offscript Android validation'
            echo '```'
            grep -E '^e: |^error: |^ERROR: |FAIL|failed|tests completed|BUILD SUCCESSFUL|BUILD FAILED' build.log | tail -65
            find app/build -name '*.xml' -path '*test-results*' -exec grep -h '<testsuite ' {} \; | head -15
            tail -55 build.log
            echo '```'
          } > report.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md
          exit 0
      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offscript-apk-and-tests
          path: |
            offscript-android/app/build/outputs/apk/debug/*.apk
            offscript-android/app/build/reports/androidTests/
            offscript-android/app/build/reports/tests/
            offscript-android/screenshots/
            offscript-android/build.log
      - name: Publish installable preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk offscript-1.0.0-preview.apk
          sha256sum offscript-1.0.0-preview.apk > SHA256SUMS.txt
          gh release create offscript-v1.0.0 offscript-1.0.0-preview.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Offscript 1.0.0 — Native Android Preview' --notes-file RELEASE.md
