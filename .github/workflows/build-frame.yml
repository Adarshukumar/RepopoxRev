name: Frame Android + real uBO Lite
on:
  push:
    branches: [arena/c4a5f7e4-repopoxrev]
    paths: ['frame-android/**', '.github/workflows/build-frame.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Frame 1.0.0 preview APK after all checks
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: frame-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frame-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare verified upstream extension and engine
        run: python3 ci/prepare.py | tee build-manifest.log
      - name: Configure
        run: |
          set -o pipefail
          gradle projects --console=plain 2>&1 | tee build.log
      - name: Compile native app and test APK
        run: |
          set -o pipefail
          gradle assembleDebug assembleDebugAndroidTest --console=plain 2>&1 | tee -a build.log
      - name: Domain unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --console=plain 2>&1 | tee -a build.log
      - name: Verify APK structure and signature block
        run: |
          python3 ci/verify_apk.py app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native emulator interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: frame-android
          script: bash ci/emulator.sh
      - name: Report errors and test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          {
            echo '### Frame Android + real uBO Lite validation'
            echo '```'
            grep -E '^e: |^error: |^ERROR: |FAIL|failed|tests completed|BUILD SUCCESSFUL|BUILD FAILED' build.log | tail -65
            find app/build -name '*.xml' -path '*test-results*' -exec grep -h '<testsuite ' {} \; | head -15
            find app/build/outputs/androidTest-results -name '*.xml' -exec head -c 9000 {} \;
            cat build-manifest.json
            tail -55 build.log
            tail -50 screenshots/logcat-errors.txt
            echo '```'
          } > report.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md
          exit 0
      - name: Post native screenshot previews
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 ci/screenshots.py
      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-apk-and-tests
          path: |
            frame-android/app/build/outputs/apk/debug/*.apk
            frame-android/app/build/reports/androidTests/
            frame-android/app/build/reports/tests/
            frame-android/screenshots/
            frame-android/build.log
            frame-android/build-manifest.json
      - name: Publish installable preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk frame-1.0.0-preview.apk
          sha256sum frame-1.0.0-preview.apk > SHA256SUMS.txt
          gh release create frame-v1.0.0 frame-1.0.0-preview.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Frame 1.0.0 — Website app with uBlock Origin Lite' --notes-file RELEASE.md
