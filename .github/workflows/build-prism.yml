name: PRISM

# Builds PRISM, the Kotlin/Compose text-analysis app under prism/.
#
# Three things about this file are deliberate, and all three exist because the
# author cannot compile this project locally: there is no JDK, no Android SDK
# and no route to the Maven repositories in the environment it is written in.
# CI is the only compiler available, so it has to be instrumented to report.
#
# 1. Each Gradle phase is its own step. Which step turns red is itself the
#    diagnosis: configuration failure means the build scripts are wrong,
#    assemble failure means Kotlin or resources are wrong, test failure means
#    the arithmetic is wrong. That distinction is visible in the job summary
#    without reading a single log line.
#
# 2. On failure the job POSTs the build log tail back into the repository as a
#    commit comment. Actions stores logs on
#    results-receiver.actions.githubusercontent.com, which is not reachable
#    from every environment that needs them; api.github.com is. This step runs
#    with errexit and pipefail disabled and always exits 0, because a
#    diagnostic that can itself fail the job is worse than no diagnostic.
#
# 3. Tests run before the artifact is published, so a wrong formula can never
#    reach a release.

on:
  push:
    branches: [ arena/c4a5f7e4-repopoxrev, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: prism

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # No gradle/wrapper jar is committed to this repository, so Gradle is
      # provisioned by the action rather than invoked through ./gradlew. The
      # version matches what the vendored Mochy-Music project pins, a pairing
      # known to work with this AGP and Kotlin release.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Show toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== java =="
            java -version 2>&1
            echo "== gradle =="
            gradle --version 2>&1
          } | tee build.log

      # Configuring the build touches settings.gradle.kts, both build scripts
      # and the version catalog, but compiles nothing. Splitting it out means a
      # red mark here points at the build scripts rather than at Kotlin.
      - name: Configure project
        shell: bash
        run: |
          set -o pipefail
          gradle projects --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Compile Kotlin and resources
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Run unit tests (JVM, no emulator)
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --console=plain --stacktrace 2>&1 | tee -a build.log

      # Both of these run with errexit and pipefail off. `find` on a directory
      # that was never created returns 1, and under the `shell: bash` default
      # of `bash -eo pipefail` that single non-zero status is enough to abort
      # the step before the diagnostic it was gathering gets published.
      - name: Summarise unit test results
        shell: bash
        if: always()
        run: |
          set +e
          set +o pipefail
          echo "== unit test suites =="
          if [ -d app/build/test-results ]; then
            grep -rho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results 2>/dev/null | sort
          else
            echo "(no test-results directory; compilation did not reach the test phase)"
          fi
          exit 0

      - name: Verify the APK
        shell: bash
        run: |
          set -o pipefail
          python3 ci/verify_apk.py app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a build.log

      - name: Report failure back into the repository
        shell: bash
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail

          if [ -f build.log ]; then
            LOG="$(tail -n 240 build.log)"
          else
            LOG="(no build log was produced)"
          fi

          if [ -d app/build/test-results ]; then
            TESTS="$(grep -rho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results 2>/dev/null | sort)"
            [ -z "$TESTS" ] && TESTS="(test result files exist but contain no summary line)"
          else
            TESTS="(no test-results directory)"
          fi

          {
            printf '### PRISM build failed\n\n'
            printf 'Commit `%s` · run %s · job `%s`\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB"
            printf 'The red step above identifies the phase: *Configure* means the Gradle\n'
            printf 'scripts, *Compile* means Kotlin or resources, *Run unit tests* means the\n'
            printf 'engine arithmetic.\n\n'
            printf '#### unit test suites\n\n```\n%s\n```\n\n' "$TESTS"
            printf '#### last 240 lines of build log\n\n```\n%s\n```\n' "$LOG"
          } > failure-report.md

          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@failure-report.md \
            || echo "::warning::could not post the failure comment"

          # Always green: a diagnostic step that can fail the job obscures the
          # failure it exists to explain.
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-build-log
          path: prism/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-debug-apk
          path: prism/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Releases are cut from tags only. A branch push proves the build is
      # green; a tag says "ship this one".
      - name: Publish release
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="prism-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | tee -a build.log

          cat > notes.md <<NOTES
          ## PRISM ${VERSION}

          A deep text-analysis instrument for Android, written in Kotlin with Jetpack Compose.

          Paste or share any text and PRISM resolves it into six layers of measurement: surface
          counts, six published readability formulas, four lexical-richness statistics, sentence
          length distribution, weighted sentiment with an emotional arc, and word frequency
          scored against Zipf's law. The figures are then summarised in prose derived from the
          numbers rather than written around them.

          **Offline by construction.** The manifest declares no permissions at all, not even
          INTERNET, so analysis staying on the device is a property of the build rather than a
          promise in a privacy policy.

          ### Install

          1. Download \`prism-${VERSION}-debug.apk\` below.
          2. Open it and allow installation from unknown sources when prompted.

          This is a debug build signed with the Android debug key. It installs and runs
          normally; it is simply not signed with a release key.

          ### What was verified

          The engine is pure Kotlin with no android.* import, so its arithmetic is checked by
          JVM unit tests that run in the same job that produced this artifact, before it is
          published. The formulas are the published ones; the syllable counter, the tokenizer's
          sentence boundaries, every readability score and the interpretation prose are all
          pinned by hand-computed assertions.
          NOTES

          # Strip the heredoc's own indentation.
          sed -i 's/^          //' notes.md

          gh release create "${GITHUB_REF_NAME}" "$APK" \
            --title "PRISM ${VERSION}" \
            --notes-file notes.md \
            || gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
